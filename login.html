<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="main-container">
        <div class="card">
            <h2 class="title">Login Admin</h2>
            <div class="form-group">
                <div style="text-align: left;">
                    <label>Username</label>
                    <input type="text" id="username" class="input-field" placeholder="Masukkan username">
                </div>
                <div style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Masukkan password">
                </div>
                <button class="btn-primary btn-logout" onclick="login()">Login</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
